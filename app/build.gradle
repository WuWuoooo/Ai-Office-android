apply plugin: 'com.android.application'

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.3"

    defaultConfig {
        applicationId "com.ai.office"
        minSdkVersion 19
        // 提到 29：targetSdk < 24 的应用在 Android 7+ 会被系统标记为「不支持多窗口」，
        // 导致无法使用小窗/分屏；同时 29 仍保留 requestLegacyExternalStorage 的旧存储行为。
        targetSdkVersion 29
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
}
